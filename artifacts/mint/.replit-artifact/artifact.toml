kind = "web"
previewPath = "/mint/"
title = "Gianky Mint"
version = "1.0.0"
id = "artifacts/mint"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/mint/" ]
localPort = 20509

[services.development]
run = "pnpm --filter @workspace/mint run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mint", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mint", "run", "start" ]

[services.env]
PORT = "20509"
BASE_PATH = "/mint/"
NEXT_PUBLIC_THIRDWEB_CLIENT_ID = "701cc72c7c405d65d9eedc7db4c742d2"
